name: CI/CD - pricing-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/pricing-service/**'
      - '.github/workflows/ci-pricing.yml'
  # pas de filtre paths sur les PR : sinon les checks requis n'existent pas
  # quand la PR ne touche pas ce service et elle reste bloquee
  pull_request:
    branches: [main, develop, base/00-starter]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pricing-service

defaults:
  run:
    working-directory: apps/pricing-service

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/pricing-service/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest --junitxml=build/test-results/pytest.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: apps/pricing-service/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/pricing-service/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check app tests --output-format=github

      - name: Ruff format
        run: python -m ruff format --check app tests

      # rapport fichier genere meme si le lint a echoue
      - name: Ruff report
        if: always()
        run: |
          mkdir -p build/reports/ruff
          python -m ruff check app tests --exit-zero --output-format=junit --output-file=build/reports/ruff/ruff.xml
          python -m ruff format --diff app tests > build/reports/ruff/format.diff || true

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-quality-reports
          path: apps/pricing-service/build/reports/ruff/
          if-no-files-found: warn
          retention-days: 7

  image:
    name: Python Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, quality]
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image name
        id: image
        run: echo "ref=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: apps/pricing-service
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pricing
          cache-to: type=gha,scope=pricing,mode=max

      - name: Scan Docker image with Trivy
        if: env.PUBLISH == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.ref }}:latest
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        if: env.PUBLISH == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-scan-pricing
