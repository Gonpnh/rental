name: CI/CD - car-rental-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/car-rental-service/**'
      - '.github/workflows/ci-car-rental.yml'
  # pas de filtre paths sur les PR : sinon les checks requis n'existent pas
  # quand la PR ne touche pas ce service et elle reste bloquee
  pull_request:
    branches: [main, develop, base/00-starter]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/car-rental-service

defaults:
  run:
    working-directory: apps/car-rental-service

jobs:
  test:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Run tests
        run: ./gradlew test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            apps/car-rental-service/build/test-results/
            apps/car-rental-service/build/reports/tests/
          if-no-files-found: warn

  quality:
    name: Java quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Upload checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-quality-reports
          path: apps/car-rental-service/build/reports/checkstyle/
          if-no-files-found: warn

  image:
    name: Java Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, quality]
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # docker veut un nom en minuscules (ex: Gonpnh/rental)
      - name: Compute lowercase image name
        id: image
        run: echo "ref=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: apps/car-rental-service
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=car-rental
          cache-to: type=gha,scope=car-rental,mode=max

      - name: Scan Docker image with Trivy
        if: env.PUBLISH == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.ref }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        if: env.PUBLISH == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-scan
